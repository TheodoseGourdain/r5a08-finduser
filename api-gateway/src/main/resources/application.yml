server:
  port: 8080

spring:
  application:
    name: api-gateway
  cloud:
    gateway:
      server:
        webflux:
          # Active les en-têtes X-Forwarded-* (désactivés par défaut depuis CVE-2025-41235).
          # On fait confiance aux adresses locales et aux réseaux privés (Docker).
          trusted-proxies: '127\.0\.0\.1|10\..*|172\..*|192\.168\..*'
          routes:
            - id: ms-user
              uri: ${MS_USER_URI:http://localhost:8081}
              predicates:
                - Path=/users/**
            - id: ms-location
              uri: ${MS_LOCATION_URI:http://localhost:8082}
              predicates:
                - Path=/locations/**

            # Spécifications OpenAPI de chaque microservice
            - id: ms-user-docs
              uri: ${MS_USER_URI:http://localhost:8081}
              predicates:
                - Path=/docs/users
              filters:
                - SetPath=/v3/api-docs
            - id: ms-location-docs
              uri: ${MS_LOCATION_URI:http://localhost:8082}
              predicates:
                - Path=/docs/locations
              filters:
                - SetPath=/v3/api-docs

springdoc:
  swagger-ui:
    urls:
      - name: MS-User
        url: /docs/users
      - name: MS-Location
        url: /docs/locations