server:
  port: 8080

spring:
  application:
    name: api-gateway
  cloud:
    gateway:
      server:
        webflux:
          routes:
            - id: ms-user
              uri: ${MS_USER_URI:http://localhost:8081}
              predicates:
                - Path=/users/**
            - id: ms-location
              uri: ${MS_LOCATION_URI:http://localhost:8082}
              predicates:
                - Path=/locations/**