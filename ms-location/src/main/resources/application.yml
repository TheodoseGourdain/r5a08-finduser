server:
  port: 8082

spring:
  application:
    name: ms-location
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5433/locationdb}
    username: ${DB_USERNAME:location}
    password: ${DB_PASSWORD:location}
  jpa:
    open-in-view: false
    show-sql: true
    hibernate:
      ddl-auto: update
  grpc:
    client:
      channel:
        user-service:
          target: ${USER_SERVICE_GRPC_TARGET:localhost:9090}