server:
  port: 8082

spring:
  application:
    name: ms-location
  datasource:
    url: jdbc:postgresql://localhost:5433/locationdb
    username: location
    password: location
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
  grpc:
    client:
      channel:
        user-service:
          target: localhost:9090

user-verifier:
  mode: stub