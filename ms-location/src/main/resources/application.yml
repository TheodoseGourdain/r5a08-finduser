server:
  port: 8082
  forward-headers-strategy: framework

spring:
  application:
    name: ms-location
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5433/locationdb}
    username: ${DB_USERNAME:location}
    password: ${DB_PASSWORD:location}
  jpa:
    open-in-view: false
    show-sql: true
    hibernate:
      ddl-auto: update
  grpc:
    client:
      channel:
        user-service:
          target: ${USER_SERVICE_GRPC_TARGET:localhost:9090}
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    producer:
      properties:
        max.block.ms: 5000

app:
  kafka:
    topics:
      location-updated: user.location.updated