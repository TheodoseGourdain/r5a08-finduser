services:
  # API GATEWAY (EXISTANT)
  api-gateway:
    build: ./api-gateway
    container_name: api-gateway
    ports:
      - '8080:8080'
    depends_on:
      - ms-user
      - ms-location
    networks:
      - gateway-net

  # MS-USER (EXISTANT)
  ms-user:
    build: ./ms-user
    container_name: ms-user
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://user-db:5432/userdb
      SPRING_DATASOURCE_USERNAME: user
      SPRING_DATASOURCE_PASSWORD: user
    depends_on:
      - user-db
    networks:
      - gateway-net
      - internal-net
      - user-db-net

  # MS-LOCATION (MODIFIÉ)
  ms-location:
    build: ./ms-location
    container_name: ms-location
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://location-db:5432/locationdb
      SPRING_DATASOURCE_USERNAME: location
      SPRING_DATASOURCE_PASSWORD: location

      # Connexion gRPC vers MS-User
      USER_GRPC_HOST: ms-user
      USER_GRPC_PORT: 9090

      # NOUVEAU : connexion Kafka
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092

    depends_on:
      - location-db
      - ms-user
      - kafka
    networks:
      - gateway-net
      - internal-net
      - location-db-net
      - backend

  # POSTGRESQL USER (EXISTANT)
  user-db:
    image: postgres:16
    container_name: user-db
    environment:
      POSTGRES_DB: userdb
      POSTGRES_USER: user
      POSTGRES_PASSWORD: user
    volumes:
      - user-db-data:/var/lib/postgresql/data
    networks:
      - user-db-net

  # POSTGRESQL LOCATION (EXISTANT)
  location-db:
    image: postgres:16
    container_name: location-db
    environment:
      POSTGRES_DB: locationdb
      POSTGRES_USER: location
      POSTGRES_PASSWORD: location
    volumes:
      - location-db-data:/var/lib/postgresql/data
    networks:
      - location-db-net

  # NOUVEAU : KAFKA
  kafka:
    image: confluentinc/cp-kafka:7.6.0
    container_name: kafka
    ports:
      - '29092:29092'
    environment:
      CLUSTER_ID: 'MkU3OEVBNTcwNTJENDM2Qk'
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_NODE_ID: 1
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_LISTENERS: PLAINTEXT://0.0.0.0:9092,CONTROLLER://0.0.0.0:9093,PLAINTEXT_HOST://0.0.0.0:29092
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092,PLAINTEXT_HOST://localhost:29092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,CONTROLLER:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
    volumes:
      - kafka-data:/var/lib/kafka/data
    networks:
      - backend

  # NOUVEAU : REDIS
  redis:
    image: redis:7-alpine
    container_name: redis
    volumes:
      - redis-data:/data
    networks:
      - backend

  # NOUVEAU : MAILPIT
  mailpit:
    image: axllent/mailpit
    container_name: mailpit
    ports:
      - '8025:8025'
      - '1025:1025'
    networks:
      - backend

  # NOUVEAU : MS-NOTIFICATION
  ms-notification:
    build: ./ms-notification
    container_name: ms-notification
    environment:
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      MAIL_HOST: mailpit
      MAIL_PORT: 1025
      ADMIN_EMAIL: admin@example.com
    depends_on:
      - kafka
      - mailpit
    networks:
      - backend

  # NOUVEAU : MS-PROXIMITY-DETECTION
  # Service développé par ton binôme
  ms-proximity-detection:
    build: ./ms-proximity-detection
    container_name: ms-proximity-detection
    environment:
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      REDIS_HOST: redis
      REDIS_PORT: 6379
    depends_on:
      - kafka
      - redis
    networks:
      - backend

# RÉSEAUX
networks:
  gateway-net:
  internal-net:
  user-db-net:
  location-db-net:

  # Nouveau réseau partagé
  backend:

# VOLUMES
volumes:
  user-db-data:
  location-db-data:

  # Nouveaux volumes
  kafka-data:
  redis-data:
